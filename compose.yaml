services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: newsfoundry
      POSTGRES_USER: newsfoundry
      POSTGRES_PASSWORD: newsfoundry_local
    ports:
      - "127.0.0.1:55414:5432"
    volumes:
      - newsfoundry_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newsfoundry -d newsfoundry"]
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  newsfoundry_pgdata:
