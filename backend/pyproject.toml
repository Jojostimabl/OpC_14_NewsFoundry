[project]
name = "newsfoundry-backend"
version = "0.1.0"
description = "API NewsFoundry — projet OpenClassrooms 14"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.116,<1",
    "uvicorn[standard]>=0.35,<1",
    "sqlmodel>=0.0.24,<0.1",
    "psycopg2-binary>=2.9.10,<3",
    "bcrypt>=4.3,<6",
    "pydantic-settings>=2.10,<3",
    "pydantic-ai-slim[openai]>=1,<3",
    "PyJWT>=2.10,<3",
    "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
